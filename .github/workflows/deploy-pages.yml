name: Daily Product Enrichment & Dual Deploy

on:
  schedule:
    - cron: "0 0,8,14 * * *" # UTC 00:00, 08:00, 14:00 = 北京时间 08:00, 16:00, 22:00
  push:
    branches: ["main"]
  workflow_dispatch:
    inputs:
      days:
        description: "回溯查验最近多少天的简报"
        type: string
        default: "2"
      backfill:
        description: "本次额外回填多少个历史产品（旧 schema 升级优先）"
        type: string
        default: "60"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "products-selection-pipeline"
  cancel-in-progress: false

jobs:
  enrich-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TZ: Asia/Shanghai
      QWEN_API_KEY: ${{ secrets.QWEN_API_KEY }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout products-selection
        uses: actions/checkout@v4
        with:
          # Queued runs build the latest main, not the (possibly stale) trigger commit
          ref: main

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Checkout upstream briefings repo (.muse-repo)
        env:
          BRIEFINGS_DEPLOY_KEY: ${{ secrets.BRIEFINGS_DEPLOY_KEY }}
        run: |
          if [ -n "$BRIEFINGS_DEPLOY_KEY" ]; then
            mkdir -p ~/.ssh
            printf '%s\n' "$BRIEFINGS_DEPLOY_KEY" > ~/.ssh/briefings_key
            chmod 600 ~/.ssh/briefings_key
            ssh-keyscan -H github.com >> ~/.ssh/known_hosts
            GIT_SSH_COMMAND="ssh -i ~/.ssh/briefings_key -o IdentitiesOnly=yes" \
              git clone --depth 1 git@github.com:alonegg/daily-product-briefings.git .muse-repo
          else
            echo "BRIEFINGS_DEPLOY_KEY not set, skipping upstream clone"
          fi

      - name: Run unit tests (parser / sanitizer / trial desk)
        run: node --test playground/test/*.test.mjs

      - name: Enrich new products via Qwen Agent
        if: ${{ !contains(github.event.head_commit.message, '[skip enrich]') }}
        run: |
          DAYS="${{ github.event.inputs.days || '2' }}"
          BACKFILL="${{ github.event.inputs.backfill || '60' }}"
          if [ -d ".muse-repo" ] && [ -n "$QWEN_API_KEY" ]; then
            node playground/enrich-agent.mjs --days "$DAYS" --backfill "$BACKFILL" --concurrency 4
          else
            echo "Skipping enrich-agent (missing .muse-repo or QWEN_API_KEY)"
          fi

      - name: Build static dataset
        # Rebuilds every derived file (day/, products/, explore, weekly, quick, feed.xml).
        # Without .muse-repo it falls back to the committed raw/ snapshot.
        run: node playground/build-static.mjs

      - name: Commit updated enriched data & static JSON
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          [ -f playground/.enrich-failed.json ] || echo '{}' > playground/.enrich-failed.json
          STATE="playground/enriched-products.json playground/.enrich-failed.json playground/public/data/raw"
          MSG="chore: daily enriched product update [skip enrich]"
          git add $STATE
          if git diff --cached --quiet; then
            echo "No data changes to commit."
            exit 0
          fi
          git commit -q -m "$MSG"
          # main may have moved during the run (merges, an earlier run's data commit):
          # re-apply this run's state on top of the latest main instead of losing it.
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then exit 0; fi
            echo "::warning::Push rejected (attempt $attempt); merging this run's state into latest main"
            cp playground/enriched-products.json "$RUNNER_TEMP/ours-enriched.json"
            cp playground/.enrich-failed.json "$RUNNER_TEMP/ours-failed.json"
            rm -rf "$RUNNER_TEMP/ours-raw" && cp -r playground/public/data/raw "$RUNNER_TEMP/ours-raw"
            git fetch -q origin main
            git reset -q --hard origin/main
            node playground/merge-state.mjs "$RUNNER_TEMP/ours-enriched.json" "$RUNNER_TEMP/ours-failed.json"
            cp -r "$RUNNER_TEMP/ours-raw/." playground/public/data/raw/
            git add $STATE
            git diff --cached --quiet && exit 0
            git commit -q -m "$MSG"
            sleep $((attempt * 5))
          done
          echo "::error::Could not push enrichment state after 3 attempts"
          exit 1

      - name: Prepare versioned Pages artifact
        run: node playground/prepare-pages.mjs "$RUNNER_TEMP/products-selection-site"

      - name: Deploy to Cloudflare Pages
        run: |
          # Scoped API token (Account · Cloudflare Pages: Edit on this account only)
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then
            npx --yes wrangler@4 pages deploy "$RUNNER_TEMP/products-selection-site" --project-name=products-selection --branch=main --commit-dirty=true
          else
            echo "::error::CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID not set; cannot deploy to Cloudflare Pages"
            exit 1
          fi

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/products-selection-site

  # Separate job: deploying in the same job as the upload intermittently fails with
  # 'No artifacts named "github-pages" were found' (artifact listing is eventually consistent).
  deploy-github-pages:
    needs: enrich-and-deploy
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
